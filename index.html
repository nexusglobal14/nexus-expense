<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Expense - Budget & Expense Tracker</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#171a21] text-slate-200 min-h-screen flex flex-col font-sans selection:bg-blue-600 selection:text-white">

  <!-- Header -->
  <header class="border-b border-slate-700/60 bg-[#171a21]/90 backdrop-blur-md sticky top-0 z-50 shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center shadow-lg shadow-emerald-500/20">
          <i class="fa-solid fa-wallet text-white text-sm"></i>
        </div>
        <span class="text-xl font-bold tracking-wide text-white">Nexus<span class="text-emerald-400">Expense</span></span>
      </div>
      <span class="text-xs px-3 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700">100% Offline & Private</span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full space-y-6">
    
    <!-- Financial Overview Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-[#1e222b] border border-slate-700/80 p-5 rounded-2xl shadow-sm">
        <span class="text-xs text-slate-400 block font-medium">Total Balance</span>
        <span id="balance-amount" class="text-2xl font-bold text-white mt-1 block">$0.00</span>
      </div>
      <div class="bg-[#1e222b] border border-slate-700/80 p-5 rounded-2xl shadow-sm">
        <span class="text-xs text-slate-400 block font-medium">Total Income</span>
        <span id="income-amount" class="text-2xl font-bold text-emerald-400 mt-1 block">+$0.00</span>
      </div>
      <div class="bg-[#1e222b] border border-slate-700/80 p-5 rounded-2xl shadow-sm">
        <span class="text-xs text-slate-400 block font-medium">Total Expenses</span>
        <span id="expense-amount" class="text-2xl font-bold text-rose-400 mt-1 block">-$0.00</span>
      </div>
    </div>

    <!-- Main Content Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- Form Column -->
      <div class="bg-[#1e222b] border border-slate-700/80 p-5 rounded-2xl shadow-sm h-fit space-y-4">
        <h2 class="text-base font-semibold text-white flex items-center space-x-2">
          <i class="fa-solid fa-circle-plus text-emerald-400 text-sm"></i>
          <span>Add Transaction</span>
        </h2>
        
        <form id="transaction-form" onsubmit="addTransaction(event)" class="space-y-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Title / Description</label>
            <input type="text" id="tx-title" required placeholder="e.g. Monthly Shopping" class="w-full bg-[#171a21] border border-slate-700 text-slate-200 text-sm px-3 py-2.5 rounded-xl focus:outline-none focus:border-emerald-500">
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-1">Amount</label>
            <input type="number" step="0.01" id="tx-amount" required placeholder="e.g. 500" class="w-full bg-[#171a21] border border-slate-700 text-slate-200 text-sm px-3 py-2.5 rounded-xl focus:outline-none focus:border-emerald-500">
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-1">Type</label>
            <select id="tx-type" class="w-full bg-[#171a21] border border-slate-700 text-slate-200 text-sm px-3 py-2.5 rounded-xl focus:outline-none focus:border-emerald-500">
              <option value="expense">Expense (-)</option>
              <option value="income">Income (+)</option>
            </select>
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-1">Category</label>
            <select id="tx-category" class="w-full bg-[#171a21] border border-slate-700 text-slate-200 text-sm px-3 py-2.5 rounded-xl focus:outline-none focus:border-emerald-500">
              <option value="Grocery">Grocery</option>
              <option value="Petrol">Petrol / Fuel</option>
              <option value="Milk">Milk</option>
              <option value="Bills">Bills & Utilities</option>
              <option value="Salary">Salary</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-xl text-sm transition shadow-lg shadow-emerald-600/20 active:scale-95">
            Add Transaction
          </button>
        </form>
      </div>

      <!-- History & Category Totals Column -->
      <div class="md:col-span-2 space-y-6">
        
        <!-- Category Totals Summary Box -->
        <div class="bg-[#1e222b] border border-slate-700/80 p-5 rounded-2xl shadow-sm space-y-3">
          <h2 class="text-sm font-semibold text-white flex items-center space-x-2">
            <i class="fa-solid fa-chart-pie text-emerald-400"></i>
            <span>Category-wise Totals</span>
          </h2>
          <div id="category-totals-list" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
            <!-- Dynamically injected category totals -->
          </div>
        </div>

        <!-- Recent Transactions -->
        <div class="bg-[#1e222b] border border-slate-700/80 p-5 rounded-2xl shadow-sm space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="text-base font-semibold text-white flex items-center space-x-2">
              <i class="fa-solid fa-list-check text-blue-400 text-sm"></i>
              <span>Recent Transactions</span>
            </h2>
            <button onclick="clearAllData()" class="text-xs text-rose-400 hover:text-rose-300 transition">Clear All</button>
          </div>

          <!-- Transaction List -->
          <ul id="transaction-list" class="space-y-2 max-h-64 overflow-y-auto pr-1">
            <!-- Items injected dynamically via JS -->
          </ul>
        </div>

      </div>

    </div>

  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-700/60 py-6 text-center text-xs text-slate-400">
    <p>&copy; 2026 Nexus Expense. All data stays in your browser.</p>
  </footer>

  <!-- JavaScript Implementation -->
  <script>
    let transactions = JSON.parse(localStorage.getItem('my_transactions')) || [];

    function updateUI() {
      const listEl = document.getElementById('transaction-list');
      const categoryTotalsEl = document.getElementById('category-totals-list');
      const balanceEl = document.getElementById('balance-amount');
      const incomeEl = document.getElementById('income-amount');
      const expenseEl = document.getElementById('expense-amount');

      listEl.innerHTML = '';
      categoryTotalsEl.innerHTML = '';

      let totalIncome = 0;
      let totalExpense = 0;
      let categoryTotals = {};

      if (transactions.length === 0) {
        listEl.innerHTML = '<p class="text-xs text-slate-500 text-center py-6">No transactions added yet.</p>';
        categoryTotalsEl.innerHTML = '<p class="text-xs text-slate-500 col-span-full py-2">No category data available.</p>';
      } else {
        transactions.forEach((tx, index) => {
          const amountNum = parseFloat(tx.amount);
          
          if (tx.type === 'income') {
            totalIncome += amountNum;
          } else {
            totalExpense += amountNum;
            if (!categoryTotals[tx.category]) {
              categoryTotals[tx.category] = 0;
            }
            categoryTotals[tx.category] += amountNum;
          }

          // Render Transaction Item
          const li = document.createElement('li');
          li.className = `flex items-center justify-between p-3 rounded-xl bg-[#171a21] border border-slate-700/50 text-sm`;
          li.innerHTML = `
            <div class="flex items-center space-x-3">
              <span class="w-2 h-2 rounded-full ${tx.type === 'income' ? 'bg-emerald-500' : 'bg-rose-500'}"></span>
              <div>
                <p class="font-medium text-slate-200">${tx.title}</p>
                <span class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded border border-slate-700">${tx.category}</span>
              </div>
            </div>
            <div class="files flex items-center space-x-3">
              <span class="font-mono ${tx.type === 'income' ? 'text-emerald-400' : 'text-rose-400'}">
                ${tx.type === 'income' ? '+' : '-'}$${amountNum.toFixed(2)}
              </span>
              <button onclick="deleteTransaction(${index})" class="text-slate-500 hover:text-rose-400 text-xs transition">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          `;
          listEl.appendChild(li);
        });

        // Render Category Totals Cards
        const categories = Object.keys(categoryTotals);
        if (categories.length === 0) {
          categoryTotalsEl.innerHTML = '<p class="text-xs text-slate-500 col-span-full py-2">No expense categories recorded yet.</p>';
        } else {
          categories.forEach(cat => {
            const catCard = document.createElement('div');
            catCard.className = 'bg-[#171a21] border border-slate-700/60 p-3 rounded-xl';
            catCard.innerHTML = `
              <span class="text-[11px] text-slate-400 block font-medium">${cat}</span>
              <span class="text-base font-bold text-rose-400 mt-0.5 block">$${categoryTotals[cat].toFixed(2)}</span>
            `;
            categoryTotalsEl.appendChild(catCard);
          });
        }
      }

      const netBalance = totalIncome - totalExpense;
      balance_amount = netBalance;
      balanceEl.innerText = `$${netBalance.toFixed(2)}`;
      incomeEl.innerText = `+$${totalIncome.toFixed(2)}`;
      expenseEl.innerText = `-$${totalExpense.toFixed(2)}`;

      localStorage.setItem('my_transactions', JSON.stringify(transactions));
    }

    function addTransaction(e) {
      e.preventDefault();
      const title = document.getElementById('tx-title').value.trim();
      const amount = document.getElementById('tx-amount').value;
      const type = document.getElementById('tx-type').value;
      const category = document.getElementById('tx-category').value;

      if (!title || !amount) return;

      transactions.unshift({ title, amount, type, category });
      updateUI();

      document.getElementById('ts-title') // safe reset
      document.getElementById('tx-title').value = '';
      document.getElementById('tx-amount').value = '';
    }

    function deleteTransaction(index) {
      transactions.splice(index, 1);
      updateUI();
    }

    function clearAllData() {
      if (confirm('Are you sure you want to clear all transactions?')) {
        transactions = [];
        updateUI();
      }
    }

    // Initial Render
    updateUI();
  </script>
</body>
</html>
